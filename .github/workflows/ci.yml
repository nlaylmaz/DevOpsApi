name: CI

on:
  push:
  pull_request:

env:
  APP_ENV: Test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Environment göster
        run: echo $APP_ENV

  test:
    needs: build
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test

      - name: Secret kontrol
        run: |
          if [ -z "$DB_PASSWORD" ]; then
      	    echo "Secret gelmedi"
            exit 1
          else
            echo "Secret başarıyla geldi"
          fi
