name: CI

on:
  push:
  pull_request:

env:
  APP_ENV: Test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Environment göster
        run: echo $APP_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: devops-api-build
          path: publish/

  test:
    needs: build
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test

      - name: Secret kontrol
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "Secret gelmedi"
            exit 1
          else
            echo "Secret başarıyla geldi"
          fi

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Docker image oluştur
        run: docker build -t nlaplmaz/devops-api:v1 .
