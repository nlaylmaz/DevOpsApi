name: CI

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  APP_ENV: Test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Environment göster
        run: echo $APP_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: devops-api-build
          path: publish/

  test:
    needs: build
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test

      - name: Secret kontrol
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "Secret gelmedi"
            exit 1
          else
            echo "Secret başarıyla geldi"
          fi

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image oluştur
        run: docker build -t nlaplmaz/devops-api:${{ github.sha }} .

      - name: Docker Hub'a gönder
        run: docker push nlaplmaz/devops-api:${{ github.sha }}

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Azure'a giriş
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Container App'i güncelle
        run: |
          az containerapp update \
            --name devops-api \
            --resource-group devops-rg \
            --image nlaplmaz/devops-api:${{ github.sha }}
